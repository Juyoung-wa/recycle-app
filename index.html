<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>분리수거 도우미</title>
  <style>
    :root {
      --bg: #f4f7f5;
      --card: #ffffff;
      --text: #1d2b24;
      --muted: #6b7a72;
      --border: #dfe7e2;
      --accent: #2f9e6b;
      --bar-bg: #e9efeb;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #121815;
        --card: #1b2420;
        --text: #e6eee9;
        --muted: #93a39a;
        --border: #2a3630;
        --accent: #4cc38a;
        --bar-bg: #26312c;
      }
    }
    :root[data-theme="dark"] {
      --bg: #121815;
      --card: #1b2420;
      --text: #e6eee9;
      --muted: #93a39a;
      --border: #2a3630;
      --accent: #4cc38a;
      --bar-bg: #26312c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    button, .file-btn {
      flex: 1 1 140px;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      text-align: center;
    }
    button.secondary, .file-btn {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .file-btn input { display: none; }
    #stage {
      margin-top: 16px;
      aspect-ratio: 1 / 1;
      width: 100%;
      border-radius: 12px;
      background: var(--bar-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: var(--muted);
    }
    #stage canvas, #stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #result { display: none; }
    #result .icon { font-size: 2.6rem; line-height: 1; }
    #result .head { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
    #result .name { font-size: 1.4rem; font-weight: 700; }
    #result .conf { color: var(--muted); font-size: .9rem; }
    #result ul { margin: 8px 0 0; padding-left: 20px; }
    .bar-row { margin: 8px 0; }
    .bar-label { display: flex; justify-content: space-between; font-size: .9rem; }
    .bar { height: 10px; background: var(--bar-bg); border-radius: 6px; overflow: hidden; }
    .bar > span { display: block; height: 100%; width: 0; border-radius: 6px; transition: width .15s; }
    #status { color: var(--muted); font-size: .9rem; margin-top: 8px; min-height: 1.4em; }
  </style>
</head>
<body>
<main>
  <h1>♻️ 분리수거 도우미</h1>
  <p class="sub">카메라로 비추거나 사진을 올리면 어떻게 버려야 하는지 알려드려요.</p>

  <div class="card">
    <div class="controls">
      <button id="camBtn" disabled>📷 카메라 켜기</button>
      <button id="flipBtn" class="secondary" disabled hidden>🔄 카메라 전환</button>
      <label class="file-btn" id="fileLabel">🖼️ 사진 올리기
        <input type="file" id="fileInput" accept="image/*" disabled>
      </label>
    </div>
    <div id="stage">모델을 불러오는 중…</div>
    <div id="status"></div>
  </div>

  <div class="card" id="result">
    <div class="head">
      <div class="icon" id="resIcon"></div>
      <div>
        <div class="name" id="resName"></div>
        <div class="conf" id="resConf"></div>
      </div>
    </div>
    <ul id="resTips"></ul>
  </div>

  <div class="card">
    <strong>예측 확률</strong>
    <div id="bars"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
<script>
  const MODEL_URL = "./my_model/";

  // 모델 라벨별 안내 정보
  const INFO = {
    "plastic": {
      name: "플라스틱", icon: "🧴", color: "#3b82f6",
      tips: ["내용물을 비우고 물로 헹궈주세요.", "라벨과 뚜껑은 분리해서 버려주세요.", "찌그러뜨려 부피를 줄이면 좋아요."]
    },
    "paper": {
      name: "종이", icon: "📦", color: "#d97706",
      tips: ["테이프·스테이플러 심은 제거해주세요.", "상자는 펼쳐서 납작하게 묶어주세요.", "물에 젖거나 음식물이 묻은 종이는 일반쓰레기예요."]
    },
    "can": {
      name: "캔", icon: "🥫", color: "#64748b",
      tips: ["내용물을 비우고 헹궈주세요.", "가능하면 납작하게 눌러주세요.", "부탄가스·스프레이 캔은 구멍을 뚫어 가스를 뺀 뒤 버려주세요."]
    },
    "general waste": {
      name: "일반쓰레기", icon: "🗑️", color: "#ef4444",
      tips: ["종량제 봉투에 담아 버려주세요.", "재활용이 어려운 오염된 물건이 여기에 해당해요."]
    },
    "nothing": {
      name: "인식된 물건 없음", icon: "🔍", color: "#9ca3af",
      tips: ["버릴 물건을 카메라 가운데에 비춰주세요."]
    }
  };
  const MIN_CONFIDENCE = 0.6;

  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  let model, webcam, maxPredictions;
  let running = false;
  let facingMode = "environment";

  async function init() {
    try {
      model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
      maxPredictions = model.getTotalClasses();
      buildBars(model.getClassLabels());
      stage.textContent = "카메라를 켜거나 사진을 올려주세요";
      $("camBtn").disabled = false;
      $("fileInput").disabled = false;
    } catch (e) {
      console.error(e);
      stage.textContent = "모델을 불러오지 못했어요.";
      $("status").textContent = location.protocol === "file:"
        ? "index.html을 직접 열면 동작하지 않아요. 로컬 서버(예: python -m http.server)로 실행해주세요."
        : "my_model 폴더 경로를 확인해주세요.";
    }
  }

  function buildBars(labels) {
    $("bars").innerHTML = labels.map((l, i) => {
      const info = INFO[l] || { name: l, color: "#2f9e6b" };
      return `<div class="bar-row">
        <div class="bar-label"><span>${info.name}</span><span id="pct${i}">0%</span></div>
        <div class="bar"><span id="bar${i}" style="background:${info.color}"></span></div>
      </div>`;
    }).join("");
  }

  async function startCam() {
    $("camBtn").disabled = true;
    $("status").textContent = "카메라를 켜는 중…";
    try {
      webcam = new tmImage.Webcam(400, 400, facingMode === "user");
      await webcam.setup({ facingMode });
      await webcam.play();
      stage.innerHTML = "";
      stage.appendChild(webcam.canvas);
      running = true;
      $("camBtn").textContent = "⏹️ 카메라 끄기";
      $("flipBtn").hidden = false;
      $("flipBtn").disabled = false;
      $("status").textContent = "";
      requestAnimationFrame(loop);
    } catch (e) {
      console.error(e);
      $("status").textContent = "카메라를 사용할 수 없어요. 권한을 허용했는지 확인해주세요.";
    }
    $("camBtn").disabled = false;
  }

  function stopCam() {
    running = false;
    if (webcam) { webcam.stop(); webcam = null; }
    $("camBtn").textContent = "📷 카메라 켜기";
    $("flipBtn").hidden = true;
  }

  async function loop() {
    if (!running || !webcam) return;
    webcam.update();
    await predict(webcam.canvas);
    requestAnimationFrame(loop);
  }

  async function predict(input) {
    const preds = await model.predict(input);
    let best = preds[0];
    preds.forEach((p, i) => {
      const pct = Math.round(p.probability * 100);
      $("bar" + i).style.width = pct + "%";
      $("pct" + i).textContent = pct + "%";
      if (p.probability > best.probability) best = p;
    });
    showResult(best);
  }

  function showResult(best) {
    const sure = best.probability >= MIN_CONFIDENCE;
    const info = sure ? (INFO[best.className] || { name: best.className, icon: "❔", tips: [] })
                      : { name: "잘 모르겠어요", icon: "🤔", tips: ["물건을 더 가까이, 밝은 곳에서 비춰주세요."] };
    $("result").style.display = "block";
    $("resIcon").textContent = info.icon;
    $("resName").textContent = info.name;
    $("resConf").textContent = `확신도 ${Math.round(best.probability * 100)}%`;
    $("resTips").innerHTML = info.tips.map(t => `<li>${t}</li>`).join("");
  }

  $("camBtn").onclick = () => running ? stopCam() : startCam();

  $("flipBtn").onclick = async () => {
    facingMode = facingMode === "environment" ? "user" : "environment";
    stopCam();
    await startCam();
  };

  $("fileInput").onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    stopCam();
    const img = new Image();
    img.onload = async () => {
      stage.innerHTML = "";
      stage.appendChild(img);
      await predict(img);
    };
    img.src = URL.createObjectURL(file);
    e.target.value = "";
  };

  init();
</script>
</body>
</html>
